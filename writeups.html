        quora: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#B92B27" viewBox="0 0 16 16" role="img" aria-label="Quora"><path d="M8.73 12.476c-.554-1.091-1.204-2.193-2.473-2.193-.242 0-.484.04-.707.142l-.43-.863c.525-.45 1.373-.808 2.464-.808 1.697 0 2.568.818 3.26 1.86.41-.89.605-2.093.605-3.584 0-3.724-1.165-5.636-3.885-5.636-2.68 0-3.839 1.912-3.839 5.636 0 3.704 1.159 5.596 3.84 5.596.425 0 .811-.046 1.166-.15Zm.665 1.3a7.127 7.127 0 0 1-1.83.244C3.994 14.02.5 11.172.5 7.03.5 2.849 3.995 0 7.564 0c3.63 0 7.09 2.828 7.09 7.03 0 2.337-1.09 4.236-2.675 5.464.512.767 1.04 1.277 1.773 1.277.802 0 1.125-.62 1.179-1.105h1.043c.061.647-.262 3.334-3.178 3.334-1.767 0-2.7-1.024-3.4-2.224Z"/></svg>',
        linkedin: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#0A66C2" viewBox="0 0 16 16" role="img" aria-label="LinkedIn"><path d="M4.943 13.394V6.169H2.542v7.225h2.401zM3.743 5.182c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zM8.651 13.394V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016a5.54 5.54 0 0 1 .016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z"/></svg>'
      };
      var LABELS = { substack: 'Substack', medium: 'Medium', quora: 'Quora', linkedin: 'LinkedIn' };

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      var articles = (window.__ARTICLES__ || []);
      var grouped = {};
      articles.forEach(function (a) {
        grouped[a.year] = grouped[a.year] || [];
        grouped[a.year].push(a);
      });
      var years = Object.keys(grouped).sort(function (a, b) { return b - a; });

      var html = years.map(function (year) {
        var rows = grouped[year].map(function (article) {
          var icon = ICONS[article.source] || '';
          var label = LABELS[article.source] || '';
          return '' +
            '<a class="group flex items-start gap-3 py-3 px-3 -mx-3 rounded-lg no-underline hover:bg-[#f8f7f1] transition-colors" href="' + escapeHtml(article.link) + '" target="_blank" rel="noopener noreferrer">' +
              '<span class="shrink-0 mt-0.5 relative -top-0.5" title="' + label + '">' + icon + '</span>' +
              '<span class="relative -top-0.5 text-base font-normal text-[#212529] leading-[28px] underline decoration-dashed decoration-1 decoration-[#78716C] underline-offset-[6px] transition-colors min-w-0 group-hover:text-[#F44322] group-hover:decoration-[#F44322]">' + escapeHtml(article.title) + '</span>' +
            '</a>';
        }).join('');

        return '' +
          '<div class="pt-12">' +
            '<div class="text-[19px] font-bold border-b border-[#bdbdbd] pb-3 mb-6">' + year + '</div>' +
            rows +
          '</div>';
      }).join('');

      document.getElementById('writeups-list').innerHTML = html;
    })();
  </script>

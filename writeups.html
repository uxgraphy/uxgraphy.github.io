  <script>
    (function () {
      var ICONS = {
        substack: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#fff" viewBox="0 0 16 16" role="img" aria-label="Substack"><path d="M15 3.604H1v1.891h14v-1.89ZM1 7.208V16l7-3.926L15 16V7.208zM15 0H1v1.89h14z"/></svg>',
        medium: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#fff" viewBox="0 0 16 16" role="img" aria-label="Medium"><path d="M9.025 8c0 2.485-2.02 4.5-4.513 4.5A4.506 4.506 0 0 1 0 8c0-2.486 2.02-4.5 4.512-4.5A4.506 4.506 0 0 1 9.025 8m4.95 0c0 2.34-1.01 4.236-2.256 4.236-1.246 0-2.256-1.897-2.256-4.236 0-2.34 1.01-4.236 2.256-4.236 1.246 0 2.256 1.897 2.256 4.236M16 8c0 2.096-.355 3.795-.794 3.795-.438 0-.793-1.7-.793-3.795 0-2.096.355-3.795.794-3.795.438 0 .793 1.699.793 3.795"/></svg>',
        quora: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#fff" viewBox="0 0 16 16" role="img" aria-label="Quora"><path d="M8.73 12.476c-.554-1.091-1.204-2.193-2.473-2.193-.242 0-.484.04-.707.142l-.43-.863c.525-.45 1.373-.808 2.464-.808 1.697 0 2.568.818 3.26 1.86.41-.89.605-2.093.605-3.584 0-3.724-1.165-5.636-3.885-5.636-2.68 0-3.839 1.912-3.839 5.636 0 3.704 1.159 5.596 3.84 5.596.425 0 .811-.046 1.166-.15Zm.665 1.3a7.127 7.127 0 0 1-1.83.244C3.994 14.02.5 11.172.5 7.03.5 2.849 3.995 0 7.564 0c3.63 0 7.09 2.828 7.09 7.03 0 2.337-1.09 4.236-2.675 5.464.512.767 1.04 1.277 1.773 1.277.802 0 1.125-.62 1.179-1.105h1.043c.061.647-.262 3.334-3.178 3.334-1.767 0-2.7-1.024-3.4-2.224Z"/></svg>',
        linkedin: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#fff" viewBox="0 0 16 16" role="img" aria-label="LinkedIn"><path d="M4.943 13.394V6.169H2.542v7.225h2.401zM3.743 5.182c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zM8.651 13.394V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016a5.54 5.54 0 0 1 .016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z"/></svg>'
      };
      var COLORS = { substack: '#FF6719', medium: '#242424', quora: '#B92B27', linkedin: '#0A66C2' };
      var LABELS = { substack: 'Substack', medium: 'Medium', quora: 'Quora', linkedin: 'LinkedIn' };

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      var articles = (window.__ARTICLES__ || []);
      var grouped = {};
      articles.forEach(function (a) {
        grouped[a.year] = grouped[a.year] || [];
        grouped[a.year].push(a);
      });
      var years = Object.keys(grouped).sort(function (a, b) { return b - a; });

      var html = years.map(function (year) {
        var rows = grouped[year].map(function (article) {
          var color = COLORS[article.source] || '#888';
          var icon = ICONS[article.source] || '';
          var label = LABELS[article.source] || '';
          return '' +
            '<a class="group block no-underline text-inherit rounded-lg px-3 -mx-3 py-2 transition-colors duration-150 hover:bg-[#f8f7f1]" href="' + escapeHtml(article.link) + '" target="_blank" rel="noopener noreferrer">' +
              '<div class="inline-flex items-center gap-2.5">' +
                '<div class="w-7 h-7 flex-none rounded-lg flex items-center justify-center" style="background: ' + color + ';" title="' + label + '">' + icon + '</div>' +
                '<span class="text-sm font-semibold leading-[200%] underline decoration-dashed decoration-1 decoration-[#333] underline-offset-[6px] transition-colors duration-200 group-hover:decoration-[#222]">' + escapeHtml(article.title) + '</span>' +
                '<span class="text-[rgb(150,155,160)] opacity-0 transition-opacity duration-150 group-hover:opacity-100 group-hover:animate-nudge"><svg xmlns="http://www.w3.org/2000/svg" height="14" viewBox="0 0 24 24" width="14" fill="currentColor"><polygon points="6,6 6,8 14.59,8 5,17.59 6.41,19 16,9.41 16,18 18,18 18,6"/></svg></span>' +
              '</div>' +
            '</a>';
        }).join('');

        return '' +
          '<div class="pt-12">' +
            '<div class="text-[19px] font-bold border-b border-[#bdbdbd] pb-3 mb-6">' + year + '</div>' +
            rows +
          '</div>';
      }).join('');

      document.getElementById('writeups-list').innerHTML = html;
    })();
  </script>
